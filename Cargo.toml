[package]
name = "why_do_you_bot"
description = "Meme-quote bot for Telegram"
version = "1.0.0"
authors = [
    "Roman Bessonov <roma.bessonov@gmail.com>",
    "Mihail Preis <mihail.preis@gmail.com>"
]
readme = "README.md"
keywords = ["telegram", "telegram-bot", "meme", "quote"]
license = "MIT"
repository = "https://github.com/MihailPreis/WhyDoYou-bot/"
edition = "2024"
build = "build.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[test]]
name = "db"
path = "tests/db.rs"
required-features = ["db"]

[[test]]
name = "engine"
path = "tests/engine.rs"
required-features = []

[features]
tg = ["teloxide"]
db = ["sqlx"]

[dependencies]
teloxide = { version = "0.17", features = ["rustls", "ctrlc_handler"], optional = true, default-features = false }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"], optional = true }
dotenv = "0.15"
log = "0.4"
fern = "0.7.1"
clap = { version = "4.5", features = ["color", "derive"] }
chrono = "0.4"
regex = "1.4"
lazy_static = "1.5"
imageproc = { version = "0.25", features = ["default"] }
rusttype = "0.9"
image = "0.25.6"
reqwest = { version = "0.12.23", features = ["multipart", "rustls-tls"], default-features = false }
cfg-if = "1.0.0"
rand = "0.9.2"
uuid = { version = "1.1.1", features = ["v4"] }
mime = "0.3.16"
include_dir = "0.7.2"
ab_glyph = "0.2.31"

[build-dependencies]
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
debug = 0
strip = "symbols"